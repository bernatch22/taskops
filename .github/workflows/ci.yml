name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call: # release.yml runs these same gates on the tag — no second copy

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: ./scripts/lint
      - run: ./scripts/test
